# Render Blueprint: one Docker web service (free plan)
# Secrets (SECRET_KEY, MYSQL_*, CLOUDINARY_*, SMTP_*) are marked sync:false - set them
# in the Render dashboard (Dashboard -> Environment). The app fails loudly at
# startup if required values are missing.
services:
  - type: web
    name: findme
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FINDME_ENV
        value: production
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL_CA
        value: ca.pem
      - key: MYSQL_PORT
        value: "3306"
      - key: SECRET_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Email (optional): owners get the match PDF by email when these are set
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
