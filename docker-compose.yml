version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: findme_db
      MYSQL_USER: findme
      MYSQL_PASSWORD: findme123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p", "root"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: .
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-findme-cavendish-dev-key}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: findme
      MYSQL_PASSWORD: findme123
      MYSQL_DB: findme_db
      PORT: 5000
      FLASK_ENV: production
    volumes:
      - uploads_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
