{% extends 'base.html' %}
{% block title %}Change Password - FindMe{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-lock"></i> Change Password</h1>
        <p class="page-subtitle">Update your account password</p>
    </div>

    <div class="dash-card" style="max-width:560px;">
        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="form-group">
                <label for="current_password">Current Password <span class="required">*</span></label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password <span class="required">*</span></label>
                <input type="password" id="new_password" name="new_password" required minlength="6">
                <small class="text-muted">Minimum 6 characters</small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password <span class="required">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-accent btn-block">
                <i class="fas fa-floppy-disk"></i> Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
