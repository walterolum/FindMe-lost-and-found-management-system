name: Auto Deploy FindMe to Connected Hosts

# Automatically deploys to any hosting websites that are connected via secrets.
# Add secrets in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
# See DEPLOY.md for token creation.
# Connected hosts are auto-detected: if secret is missing, that job is skipped.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # Verify app builds before deploying
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py config.py wsgi.py
      - run: python -c "from wsgi import application; print('wsgi ok')"
      - run: python -c "from wsgi import application; c=application.test_client(); assert c.get('/health').status_code==200; print('health ok')"

  # Secrets can't be read in a job-level `if:`, so each job checks for its
  # secret in a step and skips the deploy (green, with a notice) when unset.
  railway:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway secret
        id: cfg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::notice::RAILWAY_TOKEN not set - skipping Railway"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == 'true'
      - name: Install Railway CLI
        if: steps.cfg.outputs.on == 'true'
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        if: steps.cfg.outputs.on == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service FindMe || railway up
          echo "Railway deployed - check https://railway.app/dashboard"

  render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Render secrets
        id: cfg
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::notice::RENDER_API_KEY / RENDER_SERVICE_ID not set - Render's own auto-deploy handles this push"; fi
      - name: Trigger Render Deploy
        if: steps.cfg.outputs.on == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"             -H "Authorization: Bearer ${RENDER_API_KEY}"             -H "Content-Type: application/json"             -d '{"clearCache": "do_not_clear"}'
          echo "Render deploy triggered"

  # PythonAnywhere now handled by dedicated workflow .github/workflows/pythonanywhere.yml
  # (full idempotent deploy: pull, venv, pip, migrate, collectstatic, reload via API)

  # Fallback: GitHub Pages for docs (optional)
  # Deploying Flask+MySQL to Pages is not possible (static only), so we skip.
