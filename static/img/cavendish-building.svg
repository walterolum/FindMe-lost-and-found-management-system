<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 660" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Cavendish University building silhouette">
  <defs>
    <linearGradient id="gBld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#9db9f7" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#bcd3ff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe6ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#dbe6ff" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="gGlow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow behind the tower -->
  <circle cx="960" cy="420" r="420" fill="url(#gGlow)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity=".28">
    <circle cx="180" cy="96" r="1.6"/><circle cx="420" cy="150" r="1.2"/><circle cx="640" cy="70" r="1.5"/>
    <circle cx="1180" cy="88" r="1.3"/><circle cx="1420" cy="140" r="1.7"/><circle cx="1660" cy="80" r="1.2"/>
    <circle cx="1770" cy="180" r="1.4"/><circle cx="1040" cy="60" r="1.2"/><circle cx="860" cy="110" r="1.1"/>
    <circle cx="300" cy="210" r="1.2"/><circle cx="1500" cy="230" r="1.1"/><circle cx="90" cy="260" r="1.3"/>
  </g>

  <!-- plaza / lawn -->
  <rect x="0" y="560" width="1920" height="100" fill="url(#gGround)"/>
  <line x1="0" y1="566" x2="1920" y2="566" stroke="#e7eeff" stroke-opacity=".16" stroke-width="2"/>
  <line x1="0" y1="580" x2="1920" y2="580" stroke="#e7eeff" stroke-opacity=".10" stroke-width="1.5"/>

  <!-- soft ground shadow -->
  <ellipse cx="960" cy="564" rx="430" ry="13" fill="#040b22" opacity=".28"/>

  <g stroke="#e7eeff" stroke-opacity=".42" stroke-width="2" opacity=".84">
    <!-- clock tower (behind portico) -->
    <rect x="880" y="180" width="160" height="348" fill="url(#gBld)"/>
    <rect x="872" y="166" width="176" height="16" fill="#e7eeff" fill-opacity=".30"/>
    <polygon points="872,166 1048,166 960,86" fill="url(#gBld)"/>
    <rect x="956" y="50" width="8" height="40" fill="#e7eeff" fill-opacity=".55"/>
    <path d="M964 54 h36 v22 h-36 z" fill="#f0f4ff" fill-opacity=".38"/>
    <!-- clock face -->
    <circle cx="960" cy="278" r="40" fill="#0f1c38" fill-opacity=".55" stroke="#e7eeff" stroke-opacity=".70" stroke-width="2.5"/>
    <g stroke="#f3f7ff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round">
      <line x1="960" y1="278" x2="960" y2="254"/>
      <line x1="960" y1="278" x2="978" y2="286"/>
    </g>
    <circle cx="960" cy="278" r="3.4" fill="#f3f7ff"/>

    <!-- side wings -->
    <rect x="300" y="400" width="260" height="160" fill="url(#gBld)"/>
    <polygon points="292,400 568,400 560,378 300,378" fill="#e7eeff" fill-opacity=".26"/>
    <rect x="1360" y="400" width="260" height="160" fill="url(#gBld)"/>
    <polygon points="1352,400 1628,400 1620,378 1368,378" fill="#e7eeff" fill-opacity=".26"/>

    <!-- main block -->
    <rect x="560" y="340" width="800" height="220" fill="url(#gBld)"/>
    <rect x="552" y="330" width="816" height="12" fill="#e7eeff" fill-opacity=".30"/>
  </g>

  <!-- arched wing windows -->
  <g fill="url(#gGlass)" stroke="#e7eeff" stroke-opacity=".30" stroke-width="1.5">
    <path d="M316 480 v-28 a17 17 0 0 1 34 0 v28 z"/><path d="M380 480 v-28 a17 17 0 0 1 34 0 v28 z"/>
    <path d="M444 480 v-28 a17 17 0 0 1 34 0 v28 z"/><path d="M508 480 v-28 a17 17 0 0 1 34 0 v28 z"/>
    <path d="M1376 480 v-28 a17 17 0 0 1 34 0 v28 z"/><path d="M1440 480 v-28 a17 17 0 0 1 34 0 v28 z"/>
    <path d="M1504 480 v-28 a17 17 0 0 1 34 0 v28 z"/><path d="M1568 480 v-28 a17 17 0 0 1 34 0 v28 z"/>
    <path d="M316 538 v-26 a17 17 0 0 1 34 0 v26 z"/><path d="M444 538 v-26 a17 17 0 0 1 34 0 v26 z"/>
    <path d="M1376 538 v-26 a17 17 0 0 1 34 0 v26 z"/><path d="M1504 538 v-26 a17 17 0 0 1 34 0 v26 z"/>
  </g>

  <g stroke="#e7eeff" stroke-opacity=".42" stroke-width="2" opacity=".84">
    <!-- portico slab -->
    <rect x="628" y="320" width="664" height="20" rx="4" fill="#e7eeff" fill-opacity=".26"/>

    <!-- 8 columns -->
    <g fill="url(#gBld)">
      <rect x="648" y="344" width="32" height="10"/><rect x="652" y="354" width="24" height="148"/><rect x="648" y="502" width="32" height="10"/>
      <rect x="728" y="344" width="32" height="10"/><rect x="732" y="354" width="24" height="148"/><rect x="728" y="502" width="32" height="10"/>
      <rect x="808" y="344" width="32" height="10"/><rect x="812" y="354" width="24" height="148"/><rect x="808" y="502" width="32" height="10"/>
      <rect x="888" y="344" width="32" height="10"/><rect x="892" y="354" width="24" height="148"/><rect x="888" y="502" width="32" height="10"/>
      <rect x="1008" y="344" width="32" height="10"/><rect x="1012" y="354" width="24" height="148"/><rect x="1008" y="502" width="32" height="10"/>
      <rect x="1088" y="344" width="32" height="10"/><rect x="1092" y="354" width="24" height="148"/><rect x="1088" y="502" width="32" height="10"/>
      <rect x="1168" y="344" width="32" height="10"/><rect x="1172" y="354" width="24" height="148"/><rect x="1168" y="502" width="32" height="10"/>
      <rect x="1248" y="344" width="32" height="10"/><rect x="1252" y="354" width="24" height="148"/><rect x="1248" y="502" width="32" height="10"/>
    </g>

    <!-- steps -->
    <g fill="#dfecff" fill-opacity=".18" stroke="none">
      <rect x="620" y="512" width="680" height="12"/>
      <rect x="596" y="524" width="728" height="12"/>
      <rect x="572" y="536" width="776" height="12"/>
      <rect x="548" y="548" width="824" height="12"/>
    </g>
  </g>

  <!-- grand arched double doors -->
  <g fill="url(#gGlass)" stroke="#e7eeff" stroke-opacity=".45" stroke-width="2">
    <path d="M918 512 v-72 a15 15 0 0 1 30 0 v72 z"/>
    <path d="M955 512 v-72 a15 15 0 0 1 30 0 v72 z"/>
    <line x1="933" y1="468" x2="933" y2="500"/>
    <line x1="970" y1="468" x2="970" y2="500"/>
  </g>

  <!-- acacia trees -->
  <g stroke="none" fill="#e7eeff">
    <path d="M150 560 v-62" stroke="#e7eeff" stroke-opacity=".30" stroke-width="5" fill="none"/>
    <ellipse cx="150" cy="472" rx="72" ry="14" fill-opacity=".16"/>
    <ellipse cx="150" cy="456" rx="46" ry="10" fill-opacity=".20"/>
    <path d="M248 560 v-44" stroke="#e7eeff" stroke-opacity=".26" stroke-width="4" fill="none"/>
    <ellipse cx="248" cy="492" rx="52" ry="11" fill-opacity=".14"/>
    <path d="M1700 560 v-62" stroke="#e7eeff" stroke-opacity=".30" stroke-width="5" fill="none"/>
    <ellipse cx="1700" cy="472" rx="72" ry="14" fill-opacity=".16"/>
    <ellipse cx="1700" cy="456" rx="46" ry="10" fill-opacity=".20"/>
    <path d="M1652 560 v-44" stroke="#e7eeff" stroke-opacity=".26" stroke-width="4" fill="none"/>
    <ellipse cx="1652" cy="492" rx="52" ry="11" fill-opacity=".14"/>
  </g>

  <!-- lamp posts -->
  <g stroke="#e7eeff">
    <path d="M500 560 v-92" stroke-opacity=".35" stroke-width="5" fill="none"/>
    <path d="M500 468 q30 0 30 26" stroke-opacity=".35" stroke-width="4" fill="none"/>
    <circle cx="530" cy="498" r="12" fill="#ffedaa" fill-opacity=".14" stroke="none"/>
    <circle cx="530" cy="498" r="6" fill="#ffedaa" fill-opacity=".75" stroke="none"/>
    <path d="M1420 560 v-92" stroke-opacity=".35" stroke-width="5" fill="none"/>
    <path d="M1420 468 q-30 0 -30 26" stroke-opacity=".35" stroke-width="4" fill="none"/>
    <circle cx="1390" cy="498" r="12" fill="#ffedaa" fill-opacity=".14" stroke="none"/>
    <circle cx="1390" cy="498" r="6" fill="#ffedaa" fill-opacity=".75" stroke="none"/>
  </g>
</svg>
